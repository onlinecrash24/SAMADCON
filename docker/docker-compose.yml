# The same stack as the docker-compose.yml in the project root — the two are
# compared by scripts/check_versions.py and cannot drift apart.
#
# Values come from the environment: copy .env.example in the project root to
# .env, or type the same names into a Portainer stack's environment fields.
# Anything left unset keeps the default written beside it.

services:
  samadcon:
    image: ghcr.io/onlinecrash24/samadcon:latest
    restart: unless-stopped
    environment:
      # Every value below falls back to what this file used to state outright,
      # so a stack with no .env behaves exactly as it did before.
      SAMADCON_PUBLIC_HOST: "${SAMADCON_PUBLIC_HOST:-samadcon.example.lan}"
      # The port people reach. Without a reverse proxy that is the one published
      # below, so it follows it; behind one it is the proxy's port — 443 — and
      # is then the only reason to set this separately.
      SAMADCON_PUBLIC_HTTPS_PORT: "${SAMADCON_PUBLIC_HTTPS_PORT:-${SAMADCON_HTTPS_PORT:-8443}}"
      SAMADCON_REALM: "${SAMADCON_REALM:-EXAMPLE.LAN}"
      SAMADCON_DC_HOSTS: "${SAMADCON_DC_HOSTS:-192.168.1.1}"
      SAMADCON_LOG_LEVEL: "${SAMADCON_LOG_LEVEL:-INFO}"
      # Only behind a reverse proxy, and then its host's address. Never 0.0.0.0/0.
      SAMADCON_TRUSTED_PROXIES: "${SAMADCON_TRUSTED_PROXIES:-}"
    ports:
      # host port : container port. The container always listens on 8443 and
      # that never changes; SAMADCON_HTTPS_PORT is the left one, for a host
      # where 8443 is already taken.
      - "${SAMADCON_HTTPS_PORT:-8443}:8443"
    # Only needed without SAMADCON_DC_HOSTS: finding a DC through SRV records
    # takes a resolver that serves the domain, which is usually the DC itself.
    # Uncommenting the four lines is enough — the resolver defaults to the
    # domain controller and the search domain to the realm, which is what they
    # are in nearly every domain. (A compose key cannot be left out depending
    # on a variable, which is why this is a comment and not an empty default.)
    # dns:
    #   - "${SAMADCON_DNS:-${SAMADCON_DC_HOSTS:-192.168.1.1}}"
    # dns_search:
    #   - "${SAMADCON_DNS_SEARCH:-${SAMADCON_REALM:-EXAMPLE.LAN}}"
    volumes:
      # A certificate of your own goes in here; without one a self-signed one is
      # made on first start. To replace it later, copy server.crt and server.key
      # into this volume and restart the stack.
      - samadcon-tls:/etc/samadcon/tls
      # CA bundles for validating the DCs' LDAPS certificates. Optional: the
      # primary path is LDAP with Kerberos encryption and needs no certificate.
      - samadcon-ca:/etc/samadcon/ca
      - samadcon-cache:/var/cache/samadcon
      - samadcon-data:/var/lib/samadcon
      - samadcon-logs:/var/log/samadcon
    shm_size: 64m
    tmpfs:
      - /run/samadcon:mode=0700,uid=1000,gid=1000,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  samadcon-tls:
  samadcon-ca:
  samadcon-cache:
  samadcon-data:
  samadcon-logs:
