# SAMADCON — the published image. The copy in the project root is the same
# stack from `services:` down, and carries the long explanation; this one sits
# beside the Dockerfile so the two live together.
#
# The settings come out of the environment and none of them is optional: copy
# .env.example from the project root to .env beside this file, or type the same
# names into a Portainer stack's environment fields. Never a password — the
# console asks whoever signs in.

services:
  samadcon:
    image: ghcr.io/onlinecrash24/samadcon:latest
    restart: unless-stopped
    container_name: samadcon
    environment:
      # The name the console is reached under. It becomes the CN and the SAN of
      # the self-signed certificate, and that is the only thing it does — leave
      # it empty and the certificate is called samadcon.local, which matches no
      # one.
      SAMADCON_PUBLIC_HOST: "${SAMADCON_PUBLIC_HOST}"
      # Only for a deployment that also publishes port 8080. That is where the
      # redirect from HTTP to HTTPS lives, and this is the port it sends people
      # to. With 8443 alone published, as below, nothing reads this.
#      SAMADCON_PUBLIC_HTTPS_PORT: "${SAMADCON_PUBLIC_HTTPS_PORT:-8443}"
      # The Kerberos realm, upper case, and the domain controller. Both may be
      # empty: the sign-in form then asks for a server address.
      SAMADCON_REALM: "${SAMADCON_REALM}"
      SAMADCON_DC_HOSTS: "${SAMADCON_DC_HOSTS}"
      SAMADCON_LOG_LEVEL: "${SAMADCON_LOG_LEVEL}"
      # No free address field in the sign-in form: only the domain configured
      # above, and any listed in a servers file below. One instance per domain
      # is the arrangement this stack is written for, so it is a fixed value
      # rather than a variable; set it to 1, here in the file, only if
      # administrators should be able to type any address. A Portainer
      # environment field cannot reach it — those feed ${VAR} only.
      SAMADCON_ALLOW_CUSTOM_SERVERS: "0"
      # Several domains from one instance: list them in a servers.json and
      # mount its directory below. Profiles work with the line above at "0".
      # See docker/servers/servers.example.json for the format.
#      SAMADCON_SERVERS_FILE: "/etc/samadcon/servers/servers.json"
      # Only behind a reverse proxy, and then its host's address. Never 0.0.0.0/0.
      SAMADCON_TRUSTED_PROXIES: "${SAMADCON_TRUSTED_PROXIES}"
    ports:
      # A value written ${NAME:?...} stops the stack when NAME is empty, and
      # says which one — here the port, and below the resolver. Empty, the port
      # became "any free port" and the resolver none at all, and the container
      # started anyway.
      #
      # host port : container port. The container always listens on 8443 and
      # that does not change; the left one is for a host where 8443 is taken.
      #
      # SAMADCON_BIND narrows the address the host answers on. Unset or empty,
      # it answers on every interface, IPv4 and IPv6 — what a browser or proxy
      # on another machine needs. Behind a reverse proxy on this same host, set
      # it to 127.0.0.1: then nothing outside the host reaches a sign-in form
      # that issues Kerberos tickets for the domain. An IPv6 address goes in
      # brackets, [::1]. Written with :+ rather than :-0.0.0.0, because naming
      # 0.0.0.0 would quietly publish on IPv4 alone.
      - "${SAMADCON_BIND:+${SAMADCON_BIND}:}${SAMADCON_HTTPS_PORT:?the port on the host, such as 8443}:8443"
    # The container asks the domain controller for names. That is what lets
    # Kerberos find its KDC and the console find the other controllers, both of
    # which are SRV lookups in the domain's own zone.
    #
    # Several domains: a resolver that knows all of them, not the DC of one.
    # A DC says NXDOMAIN for every zone but its own, and a second entry here
    # is only asked when the first does not answer. Point this at dnsmasq,
    # Unbound, AdGuard or the like with a forward per zone — or delete these
    # four lines when the Docker host's own resolver already does that.
    dns:
      - "${SAMADCON_DNS:?a resolver that serves the domain, usually its DC - or delete the dns lines}"
    dns_search:
      - "${SAMADCON_DNS_SEARCH:?the domain in lower case - or delete the dns_search lines}"
    # A host whose resolver cannot be pointed at the domain at all can be given
    # the one name it needs:
    #
    #   extra_hosts:
    #     - "smb-ad.example.lan:192.168.1.1"
    #
    # That is a last resort, not a substitute for dns: above. The entry
    # resolves that one name and carries no SRV records, so the KDC and the
    # other domain controllers are still found through a resolver, or not at
    # all.
    volumes:
      # A certificate of your own goes in here; without one a self-signed one is
      # made on first start. To replace it later, copy server.crt and server.key
      # into this volume and restart the stack.
      - samadcon-tls:/etc/samadcon/tls
      # CA bundles for validating the DCs' LDAPS certificates. Optional: the
      # primary path is LDAP with Kerberos encryption and needs no certificate.
      - samadcon-ca:/etc/samadcon/ca
      - samadcon-cache:/var/cache/samadcon
      - samadcon-data:/var/lib/samadcon
      - samadcon-logs:/var/log/samadcon
      # The servers file, when SAMADCON_SERVERS_FILE above is set. An absolute
      # path on the host: a relative one resolves nowhere useful in a
      # Portainer stack. Read-only is enough; the file only has to be readable.
#      - /srv/samadcon/servers:/etc/samadcon/servers:ro
    shm_size: 64m
    tmpfs:
      - /run/samadcon:mode=0700,uid=1000,gid=1000,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  samadcon-tls:
  samadcon-ca:
  samadcon-cache:
  samadcon-data:
  samadcon-logs:
