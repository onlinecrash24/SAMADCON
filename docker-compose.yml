# SAMCON — the one compose file.
#
#   docker compose up -d --build
#
# **No .env is needed.** Every setting lives below, with the value it should
# have. Change it here and rebuild; there is no second file to keep in step and
# nothing that silently falls back to an empty string because a variable was
# not exported.
#
# Where a `${VAR:-default}` still appears it is because the value belongs to
# the machine rather than to the project — a password, a port that is already
# taken. Compose reads those from the shell:
#
#   TEST_ADMIN_PASSWORD=… docker compose up -d --build
#
# or from a `docker-compose.override.yml`, which is in .gitignore. **Never
# write a password into this file** — it is in version control.
#
# It lives in the project root on purpose. With the file under docker/, compose
# treated that directory as the project directory, so every command needed
# `-f docker/…` and forgetting it produced "no configuration file provided".
#
# The build target decides what is in the image. `runtime` is the product;
# `test` adds pytest and the test suite, which is what the integration tests
# need:
#
#   SAMCON_TARGET=test docker compose up -d --build
#   docker compose exec samcon python -m pytest tests/integration -q
#
# Tests are copied into the image rather than mounted, so a changed test file
# needs `up -d --build` before `exec`.
#
# WARNING: the integration tests create and delete objects in a throwaway OU.
# Point them at a test domain, never at production.

services:
  samcon:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SAMCON_VERSION: "0.1.0"
      target: ${SAMCON_TARGET:-runtime}
    # Tagged by target so a test image never overwrites a runtime one.
    image: samcon:${SAMCON_TARGET:-runtime}
    container_name: samcon
    restart: unless-stopped

    environment:
      # --- The domain ----------------------------------------------------
      # Both may stay empty: the sign-in form then asks for a server address
      # and works the domain out from it. When they are set, use names that
      # resolve — Kerberos needs the DC's own FQDN, and a bare IP address
      # fails with NT_STATUS_INVALID_PARAMETER rather than anything helpful.
      SAMCON_REALM: ""
      SAMCON_DC_HOSTS: ""
      SAMCON_WORKGROUP: ""

      # --- Pre-configured domains (optional) -----------------------------
      # A JSON file listing domains to offer in the sign-in form; see
      # docker/servers/servers.example.json.
      SAMCON_SERVERS_FILE: ""
      # 0 allows only the configured domains — administrators can then no
      # longer type an arbitrary address.
      SAMCON_ALLOW_CUSTOM_SERVERS: "1"

      # --- LDAP ----------------------------------------------------------
      # CA that signed the DCs' certificates. A Samba DC keeps its own at
      # /var/lib/samba/private/tls/ca.pem — copy it into docker/ca/.
      SAMCON_LDAP_CA_FILE: ""
      # Turns certificate validation off for every connection. Prefer the
      # per-session checkbox in the sign-in form over this switch.
      SAMCON_LDAP_INSECURE: "0"

      # --- Web front end -------------------------------------------------
      # The name the console is reached under. It becomes the CN and the SAN
      # of the self-signed certificate and the target of the HTTP-to-HTTPS
      # redirect, so a wrong value here is a certificate warning for everyone.
      SAMCON_PUBLIC_HOST: "samcon.example.lan"
      # Must name the port the host publishes, not the one nginx listens on.
      SAMCON_PUBLIC_HTTPS_PORT: "${SAMCON_HTTPS_PORT:-8443}"

      # --- Sessions ------------------------------------------------------
      SAMCON_TICKET_LIFETIME: "10h"
      SAMCON_RENEW_LIFETIME: "7d"
      SAMCON_SESSION_IDLE_MINUTES: "60"
      # Failed sign-ins per account before SAMCON stops forwarding attempts to
      # the DC. Protects against triggering AD account lockout through the
      # web form.
      SAMCON_LOGIN_MAX_ATTEMPTS: "5"
      SAMCON_LOGIN_LOCKOUT_MINUTES: "5"

      # --- Logging -------------------------------------------------------
      SAMCON_LOG_LEVEL: "INFO"
      # Every write operation lands here: who, what, DN, attribute diff.
      SAMCON_AUDIT_FILE: "/var/log/samcon/audit.jsonl"
      # Raise for Samba protocol traces. Noisy — 0 outside a hunt.
      SAMCON_SAMBA_LOG_LEVEL: "0"
      # Extra diagnostics and a more talkative error surface.
      SAMCON_DEV_MODE: "0"

      # --- Integration tests ---------------------------------------------
      # Only read when the image is built with SAMCON_TARGET=test. They come
      # from the shell rather than from here because one of them is a domain
      # administrator's password:
      #
      #   TEST_DC_HOST=dc1.example.lan TEST_ADMIN_PASSWORD=… \
      #     docker compose exec samcon python -m pytest tests/integration -q
      #
      # Without TEST_DC_HOST and TEST_ADMIN_PASSWORD the tests skip themselves.
      TEST_DC_HOST: "${TEST_DC_HOST:-}"
      TEST_REALM: "${TEST_REALM:-}"
      TEST_ADMIN_USER: "${TEST_ADMIN_USER:-Administrator}"
      TEST_ADMIN_PASSWORD: "${TEST_ADMIN_PASSWORD:-}"
      # Only relevant when the connection falls back to LDAPS — the primary
      # path is LDAP with Kerberos encryption and needs no certificate.
      TEST_INSECURE: "${TEST_INSECURE:-1}"

    ports:
      - "${SAMCON_HTTPS_PORT:-8443}:8443"
      - "${SAMCON_HTTP_PORT:-8080}:8080"

    # SAMCON talks to the DCs over the network and needs no DNS for the domain
    # when SAMCON_DC_HOSTS names them directly. For SRV discovery, add the DC
    # as the resolver:
    #
    #   dns: ["192.168.1.10"]
    #   dns_search: ["example.lan"]
    #
    # Kerberos needs the DC's own FQDN to resolve. Where DNS does not provide
    # it:
    #
    #   extra_hosts: ["dc1.example.lan:192.168.1.10"]

    volumes:
      # Mount a real certificate here for production; otherwise the entrypoint
      # generates a self-signed one on first start. The container runs as uid
      # 1000 and a bind mount belongs to root, so this directory has to be
      # writable for it — see the README.
      - ./docker/tls:/etc/samcon/tls
      # CA bundles for validating the DCs' LDAPS certificates.
      - ./docker/ca:/etc/samcon/ca:ro
      # Optional: pre-configured domains (see servers.example.json).
      - ./docker/servers:/etc/samcon/servers:ro
      - samcon-cache:/var/cache/samcon
      - samcon-data:/var/lib/samcon
      # The audit trail should outlive the container.
      - samcon-logs:/var/log/samcon

    # Kerberos credential caches live in /dev/shm and must never hit a disk.
    shm_size: 64m
    tmpfs:
      # uid/gid are required: a tmpfs mount belongs to root by default, and
      # nginx and supervisor run as uid 1000 and write their pid and socket
      # files here.
      - /run/samcon:mode=0700,uid=1000,gid=1000,size=8m

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  samcon-cache:
  samcon-data:
  samcon-logs:
