# SAMADCON — the published image.
#
# This is the file to deploy: it pulls a built image and needs nothing on the
# host prepared. To build from source instead — which is what the integration
# tests need — build docker/Dockerfile with the repository root as the build
# context; the README has the command. There is no compose file for that.
#
# **The settings come out of the environment, and this file states none of
# them.** That is deliberate: the values belong to your domain, not to the
# repository, and a stack updated from here never overwrites them.
#
#   cp .env.example .env
#   $EDITOR .env
#   docker compose up -d
#
# In Portainer there is no .env file. Type the same names into the stack's
# environment fields, or upload one with "Load variables from .env file". The
# compose file is not touched either way, which is the point of it.
#
# Nothing here is optional. A missing variable becomes an empty string, and an
# empty resolver or realm is a container that starts and then does not work.
# The README has a shorter stack with the values written in, for a deployment
# that does not want a second file.
#
# Every setting not named below takes its own default, and those were checked
# against the code rather than assumed. What is left is what an installation
# actually has to decide.
#
# **Named volumes, not bind mounts.** A Portainer stack has no directory of its
# own on the host: a relative path like ./tls is resolved by the Docker daemon
# rather than by Portainer, and Docker creates what is missing as a directory
# owned by root. This container runs as uid 1000, so the entrypoint could not
# write its certificate there. The image creates /etc/samadcon/tls, ca and
# servers and gives them to uid 1000, and docker seeds a named volume from the
# image directory with that ownership — so everything below just works.
#
# To keep files on the host after all — a real certificate, a servers.json —
# use an **absolute** path: /srv/samadcon/tls:/etc/samadcon/tls. That works in
# a stack; a relative one does not.
#
# **Never write a password into this file, or into the .env.** The console does
# not take one from the environment anyway: it asks whoever signs in.

services:
  samadcon:
    image: ghcr.io/onlinecrash24/samadcon:latest
    restart: unless-stopped
    container_name: samadcon
    environment:
      # The name the console is reached under. It becomes the CN and the SAN of
      # the self-signed certificate, and that is the only thing it does — leave
      # it empty and the certificate is called samadcon.local, which matches no
      # one.
      SAMADCON_PUBLIC_HOST: "${SAMADCON_PUBLIC_HOST}"
      # Only for a deployment that also publishes port 8080. That is where the
      # redirect from HTTP to HTTPS lives, and this is the port it sends people
      # to. With 8443 alone published, as below, nothing reads this.
#      SAMADCON_PUBLIC_HTTPS_PORT: "${SAMADCON_PUBLIC_HTTPS_PORT:-8443}"
      # The Kerberos realm, upper case, and the domain controller. Both may be
      # empty: the sign-in form then asks for a server address.
      SAMADCON_REALM: "${SAMADCON_REALM}"
      SAMADCON_DC_HOSTS: "${SAMADCON_DC_HOSTS}"
      SAMADCON_LOG_LEVEL: "${SAMADCON_LOG_LEVEL}"
      # Only the domain configured above. The sign-in form then shows that one
      # and nothing else. One instance per domain is the arrangement this stack
      # is written for, so it is a fixed value rather than a variable: set it
      # to 1 here, in the file, for an instance meant to reach several. A
      # Portainer environment field cannot reach it — those feed ${VAR} only.
      SAMADCON_ALLOW_CUSTOM_SERVERS: "0"
      # Only behind a reverse proxy, and then its host's address. Never 0.0.0.0/0.
      SAMADCON_TRUSTED_PROXIES: "${SAMADCON_TRUSTED_PROXIES}"
    ports:
      # host port : container port. The container always listens on 8443 and
      # that does not change; the left one is for a host where 8443 is taken.
      - "${SAMADCON_HTTPS_PORT}:8443"
    # The container asks the domain controller for names. That is what lets
    # Kerberos find its KDC and the console find the other controllers, both of
    # which are SRV lookups in the domain's own zone.
    dns:
      - "${SAMADCON_DNS}"
    dns_search:
      - "${SAMADCON_DNS_SEARCH}"
    # A host whose resolver cannot be pointed at the domain at all can be given
    # the one name it needs:
    #
    #   extra_hosts:
    #     - "smb-ad.example.lan:192.168.1.1"
    #
    # That is a last resort, not a substitute for dns: above. The entry
    # resolves that one name and carries no SRV records, so the KDC and the
    # other domain controllers are still found through a resolver, or not at
    # all.
    volumes:
      # A certificate of your own goes in here; without one a self-signed one is
      # made on first start. To replace it later, copy server.crt and server.key
      # into this volume and restart the stack.
      - samadcon-tls:/etc/samadcon/tls
      # CA bundles for validating the DCs' LDAPS certificates. Optional: the
      # primary path is LDAP with Kerberos encryption and needs no certificate.
      - samadcon-ca:/etc/samadcon/ca
      - samadcon-cache:/var/cache/samadcon
      - samadcon-data:/var/lib/samadcon
      - samadcon-logs:/var/log/samadcon
    shm_size: 64m
    tmpfs:
      - /run/samadcon:mode=0700,uid=1000,gid=1000,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  samadcon-tls:
  samadcon-ca:
  samadcon-cache:
  samadcon-data:
  samadcon-logs:
