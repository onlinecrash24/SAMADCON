[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samadcon"
# Stated once, in samadcon/__init__.py, and read from there. Three files
# carried it and a release raised two of them, so every v0.5.2 install
# reported itself as 0.5.1 — on its sign-in screen, at /health, and to the
# CLI. setuptools reads the attribute statically, so nothing is imported at
# build time and the samba bindings stay out of it.
dynamic = ["version"]
description = "SAMADCON — Samba AD Console: RSAT replacement for Samba AD DC, including a Group Policy editor"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# Deliberately short. Two heavyweight dependencies are NOT listed here because
# they come from the distribution and must not be pulled from PyPI:
#   * samba (python3-samba)  — no PyPI equivalent exists
#   * lxml  (python3-lxml)   — avoids a long native build in the image
# The floors are the versions this is built and tested against, not the oldest
# that might work. They used to be the latter and had drifted badly: the
# declared set could not be installed together at all — fastapi 0.115 caps
# starlette below its fixed versions, and a fastapi new enough to lift that cap
# will not take pydantic 2.7. Nobody had ever resolved that combination, which
# is how three of them came to permit versions with open advisories.
#
# scripts/dependency_requirements.py feeds pip-audit in CI, twice: once at what
# a build actually gets, and once with every floor pinned, which is the pass
# that catches a floor permitting something vulnerable. Lower one of these and
# that second pass is what will object.
dependencies = [
    "fastapi>=0.141.1",
    # Declared even though fastapi brings it, for two reasons: it is imported
    # directly (api/v1/servers.py), so it belongs here anyway; and fastapi's own
    # floor is starlette>=0.46.0, which permits versions carrying eight
    # advisories. Ours has to be its own.
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    # Every advisory on this package is a denial of service, and on this
    # application they are reachable without signing in: FastAPI reads the
    # request body before it solves the dependency that checks the session
    # (fastapi/routing.py — request.form() at 430, solve_dependencies at 481),
    # and four endpoints take uploads.
    "python-multipart>=0.0.32",
    "dnspython>=2.8.0",
    # Only used to reach an optional, locally run model service. Nothing
    # calls out without SAMADCON_OLLAMA_URL set.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "lxml>=5.2",
]

[project.scripts]
samadconctl = "samadcon.cli:main"

[tool.setuptools.dynamic]
version = {attr = "samadcon.__version__"}
[tool.setuptools.packages.find]
include = ["samadcon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live Samba AD DC (SAMADCON_TARGET=test, see the README)",
    "gpo: touches Group Policy objects on the test domain",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # Samba's python bindings hand us bytes/str mixtures that read badly when
    # forced into ternaries.
    "SIM108",
    # Our exception names read as sentences at the call site (raise NotFound,
    # raise Conflict). SamadconError is the one that carries the suffix.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in parameter defaults is the framework's idiom, not a
# mutable-default bug.
"samadcon/api/*" = ["B008"]
"samadcon/auth/deps.py" = ["B008"]
# Tests reach into internals on purpose and use long assertion lines.
"tests/*" = ["E501", "SLF001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
# The samba bindings are untyped C extensions.
[[tool.mypy.overrides]]
module = ["samba.*", "ldb", "dns.*"]
ignore_missing_imports = true
